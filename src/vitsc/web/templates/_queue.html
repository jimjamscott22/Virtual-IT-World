{% if not tickets %}
<p class="empty-state">No open tickets. New work will appear here during the shift.</p>
{% else %}
{% for t in tickets %}
<button type="button" class="ticket-row" data-ticket-id="{{ t.id }}" data-priority="{{ t.system_priority.value }}" data-overdue="{{ 'true' if t.is_overdue(now) else 'false' }}"
        hx-get="/ticket/{{ t.id }}" hx-target="#detail" hx-swap="innerHTML">
  <span class="ticket-row__meta">#{{ t.id }} · P{{ t.system_priority.value }}</span>
  <strong class="ticket-row__person">{{ t.persona.name }}</strong>
  <span class="ticket-row__preview">{{ t.report_text }}</span>
  {% if t.cascade_id %}<span class="incident-chip">Related incident {{ t.cascade_id }}</span>{% endif %}
  <span class="ticket-row__sla" id="sla-{{ t.id }}">{% set minutes = ((t.deadline - now).total_seconds() // 60) | int %}{% if t.is_overdue(now) %}{{ -minutes }} min overdue{% else %}Due in {{ minutes }} min{% endif %}</span>
</button>
{% endfor %}
{% endif %}
