<div id="tools">
  <form class="tool-form" hx-post="/ticket/{{ ticket.id }}/tool" hx-target="#toolout" hx-swap="innerHTML">
    <label for="tool-{{ ticket.id }}">Tool</label><select id="tool-{{ ticket.id }}" name="tool" data-tool-picker>{% for t in tools %}<option value="{{ t.name }}">{{ t.name }}</option>{% endfor %}</select>
    <label for="command-{{ ticket.id }}">Command</label><select id="command-{{ ticket.id }}" name="command" data-command-picker>{% for t in tools %}{% for cmd in t.commands() %}<option value="{{ cmd }}" data-tool="{{ t.name }}">{{ cmd }}</option>{% endfor %}{% endfor %}</select>
    <label for="args-{{ ticket.id }}">Arguments</label><input id="args-{{ ticket.id }}" type="text" name="args" placeholder="key=value key=value" autocomplete="off">
    <button type="submit">Run diagnostic</button>
  </form>
  <div id="toolout" class="tool-console" aria-live="polite">{% include "_toolout.html" %}</div>
</div>
